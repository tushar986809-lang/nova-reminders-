name: reminders
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests cryptography
      - name: Load settings from the NOVA_ENV secret
        env:
          NOVA_ENV: ${{ secrets.NOVA_ENV }}
        run: |
          printf '%s\n' "$NOVA_ENV" | tr -d '\r' | grep -E '^[A-Z_]+=' >> "$GITHUB_ENV"
      - run: python check_reminders.py
      - run: |
          git config user.name "nova-bot"
          git config user.email "nova-bot@users.noreply.github.com"
          git add reminders.json
          git diff --cached --quiet || (git commit -m "update reminders" && git pull --rebase && git push)
